name: Verify PAUSE

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test PAUSE
        run: node --test tests/pauseCalendar.test.js tests/restInsightsSafeRuntime.test.js tests/recoveryStatus.test.js tests/recoveryPlan.test.js tests/sleepRoutineSchedule.test.js tests/recoveryPlanPickerStability.test.js tests/recoveryBriefing.test.js tests/recoveryThiefLog.test.js tests/weeklyReport.test.js tests/sleepRoutineStreak.test.js tests/pauseMenu.test.js tests/orbGestures.test.js

      - name: Build PAUSE
        run: npm run build
