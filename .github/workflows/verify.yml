name: Verify PAUSE

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test PAUSE
        run: node --test tests/pauseCalendar.test.js tests/pausePushClient.test.js tests/restInsightsSafeRuntime.test.js tests/pauseSyncReconcile.test.js tests/recoveryStatus.test.js tests/recoveryPlan.test.js tests/sleepRoutineSchedule.test.js tests/recoveryPlanPickerStability.test.js tests/recoveryBriefing.test.js tests/recoveryThiefLog.test.js tests/weeklyReport.test.js tests/sleepRoutineStreak.test.js tests/pauseMenu.test.js tests/orbGestures.test.js tests/activityCommitmentsMenu.test.js tests/activityDirectoryBuild.test.js tests/activityTargetUnits.test.js

      - name: Build PAUSE
        run: npm run build

      - name: Verify Android/iOS PWA production build
        run: node scripts/verify-pwa-build.mjs

      - name: Verify Activity hold regression in browser
        run: |
          for attempt in 1 2 3; do
            if node --experimental-websocket scripts/verify-pause-activity-browser.mjs; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Browser regression attempt $attempt failed; retrying after runner timing jitter."
              sleep 1
            fi
          done
          exit 1

      - name: Verify Activity mixed-unit regression in browser
        run: node --experimental-websocket scripts/verify-pause-activity-target-units.mjs

      - name: Verify recovered Rest Insights bundle
        run: node scripts/verify-rest-insights-build.mjs
