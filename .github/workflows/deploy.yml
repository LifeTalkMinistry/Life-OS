name: Deploy PAUSE to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test PAUSE calendar, rest, sleep schedule, picker stability, briefing, sleep delay log, weekly reports, Sleep Routine Streak, orb menu, and hold-drag gesture
        run: node --test tests/pauseCalendar.test.js tests/recoveryStatus.test.js tests/recoveryPlan.test.js tests/sleepRoutineSchedule.test.js tests/recoveryPlanPickerStability.test.js tests/recoveryBriefing.test.js tests/recoveryThiefLog.test.js tests/weeklyReport.test.js tests/sleepRoutineStreak.test.js tests/pauseMenu.test.js tests/orbGestures.test.js

      - name: Build PAUSE
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
