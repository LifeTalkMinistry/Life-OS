name: Deploy PAUSE to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build PAUSE
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Clear stuck PAUSE Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          STALE_PAGES_DEPLOYMENT: 5eaf6f27f94696b08563d9d43991b2f089d6d01e
        run: |
          for attempt in $(seq 1 24); do
            status=$(gh api \
              "repos/${GITHUB_REPOSITORY}/pages/deployments/${STALE_PAGES_DEPLOYMENT}" \
              --jq '.status' 2>/dev/null || echo "not-found")

            echo "Stale Pages deployment status: ${status}"

            if [ "${status}" != "updating_pages" ]; then
              exit 0
            fi

            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/pages/deployments/${STALE_PAGES_DEPLOYMENT}/cancel" \
              >/dev/null 2>&1 || true

            sleep 10
          done

          final_status=$(gh api \
            "repos/${GITHUB_REPOSITORY}/pages/deployments/${STALE_PAGES_DEPLOYMENT}" \
            --jq '.status' 2>/dev/null || echo "not-found")

          echo "Final stale Pages deployment status: ${final_status}"
          test "${final_status}" != "updating_pages"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
