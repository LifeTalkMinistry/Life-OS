name: Deploy LIFE OS to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check
        run: npm run check

      - name: Unit and persistence regression tests
        run: npm test

      - name: Build LIFE OS
        run: npm run build

      - name: Prepare browser command
        shell: bash
        run: |
          if ! command -v chromium >/dev/null 2>&1; then
            BROWSER_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || true)"
            if [ -z "$BROWSER_BIN" ]; then
              echo "No Chromium-compatible browser found on runner"
              exit 1
            fi
            sudo ln -sf "$BROWSER_BIN" /usr/local/bin/chromium
          fi
          chromium --version

      # The older full UI smoke script still asserts the removed intermediate
      # "LIFE OS IS READY" screen. It is intentionally not a deploy gate until
      # its expectations are updated to the current atomic setup -> live Orb flow.
      - name: PWA persistence reload test
        run: node scripts/pwa-persistence-browser.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
