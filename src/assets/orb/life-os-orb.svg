<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" role="img" aria-label="LIFE OS luminous orb">
  <defs>
    <radialGradient id="core" cx="50%" cy="49%" r="58%">
      <stop offset="0%" stop-color="#00000c"/>
      <stop offset="52%" stop-color="#01000f"/>
      <stop offset="76%" stop-color="#050218"/>
      <stop offset="92%" stop-color="#100629"/>
      <stop offset="100%" stop-color="#1c0c3d"/>
    </radialGradient>
    <radialGradient id="innerTop" cx="50%" cy="0%" r="95%">
      <stop offset="0%" stop-color="#5830d8" stop-opacity=".11"/>
      <stop offset="42%" stop-color="#33187c" stop-opacity=".035"/>
      <stop offset="80%" stop-color="#120829" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#505dff"/>
      <stop offset="20%" stop-color="#5d4bff"/>
      <stop offset="46%" stop-color="#8c4cff"/>
      <stop offset="70%" stop-color="#d34ee9"/>
      <stop offset="88%" stop-color="#ff6ea9"/>
      <stop offset="100%" stop-color="#ffbd85"/>
    </linearGradient>
    <linearGradient id="hot" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#e7f0ff"/>
      <stop offset="22%" stop-color="#f2eeff"/>
      <stop offset="48%" stop-color="#f8eaff"/>
      <stop offset="72%" stop-color="#ffe9f4"/>
      <stop offset="100%" stop-color="#fff4d4"/>
    </linearGradient>
    <linearGradient id="reflection" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#345cff" stop-opacity="0"/>
      <stop offset="20%" stop-color="#355cff" stop-opacity=".60"/>
      <stop offset="43%" stop-color="#7b64ff" stop-opacity=".78"/>
      <stop offset="54%" stop-color="#ead4ff" stop-opacity=".95"/>
      <stop offset="67%" stop-color="#d880ff" stop-opacity=".72"/>
      <stop offset="86%" stop-color="#ed5ec6" stop-opacity=".46"/>
      <stop offset="100%" stop-color="#ed5ec6" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur16" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="blur10" x="-35%" y="-35%" width="170%" height="170%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="blur5" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="blur3" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="orbClip"><circle cx="626" cy="586" r="410"/></clipPath>
  </defs>

  <!-- Dark glass body sampled from the approved reference. -->
  <circle cx="626" cy="586" r="410" fill="url(#core)"/>
  <circle cx="626" cy="586" r="410" fill="url(#innerTop)"/>
  <g clip-path="url(#orbClip)">
    <ellipse cx="392" cy="655" rx="245" ry="320" fill="#164cff" opacity=".055" filter="url(#blur16)"/>
    <ellipse cx="885" cy="600" rx="220" ry="330" fill="#d63a78" opacity=".042" filter="url(#blur16)"/>
    <ellipse cx="620" cy="875" rx="300" ry="135" fill="#7b2bc4" opacity=".028" filter="url(#blur16)"/>
  </g>

  <!-- Restrained colored bloom: the reference carries most brightness in the white optical edge. -->
  <circle cx="626" cy="586" r="412" fill="none" stroke="url(#rim)" stroke-width="22" stroke-opacity=".24" filter="url(#blur10)"/>
  <circle cx="626" cy="586" r="412" fill="none" stroke="url(#rim)" stroke-width="11" stroke-opacity=".52" filter="url(#blur5)"/>

  <!-- Lower-left blue/cyan energy and warm right-side bloom. -->
  <path d="M 216 586 A 410 410 0 0 0 485 959" fill="none" stroke="#3f7eff" stroke-width="14" stroke-linecap="round" opacity=".36" filter="url(#blur5)"/>
  <path d="M 255 760 A 410 410 0 0 0 500 966" fill="none" stroke="#5ad9ff" stroke-width="7" stroke-linecap="round" opacity=".42" filter="url(#blur3)"/>
  <path d="M 822 226 A 410 410 0 0 1 1036 590" fill="none" stroke="#ff8ea8" stroke-width="12" stroke-linecap="round" opacity=".28" filter="url(#blur5)"/>

  <!-- Hot white core measured at roughly 4–5px in the 1254px reference. -->
  <circle cx="626" cy="586" r="412" fill="none" stroke="url(#hot)" stroke-width="4.4" stroke-opacity=".98"/>

  <!-- Multi-layer floor reflection: broad haze, colored pool, then a small white contact highlight. -->
  <ellipse cx="626" cy="1070" rx="235" ry="42" fill="url(#reflection)" opacity=".22" filter="url(#blur16)"/>
  <ellipse cx="626" cy="1067" rx="190" ry="25" fill="url(#reflection)" opacity=".38" filter="url(#blur10)"/>
  <ellipse cx="626" cy="1063" rx="132" ry="12" fill="url(#reflection)" opacity=".58" filter="url(#blur5)"/>
  <ellipse cx="626" cy="1061" rx="72" ry="4" fill="#f5deff" opacity=".64" filter="url(#blur3)"/>
</svg>
